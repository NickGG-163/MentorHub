[project]
name = "mentorhub"
version = "0.2.0"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
mentorhub = "mentorhub.__main__:main"

[dependency-groups]
dev = ["ruff", ]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]